# Builds and tests Parseley on a Mac for every push and pull request.
# - Package tests: all logic in Packages/ParseleyKit (swift test).
# - App build: generates the Xcode project with XcodeGen and compiles the app unsigned,
#   so UI compile errors show up here instead of on a developer's machine.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            Packages/ParseleyKit/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/ParseleyKit/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Package tests
        working-directory: Packages/ParseleyKit
        run: swift test 2>&1 | tail -n 60; exit ${PIPESTATUS[0]}

      - name: Build CLI (release)
        working-directory: Packages/ParseleyKit
        run: |
          swift build -c release --product parseley
          .build/release/parseley transforms > /dev/null
          printf '1\n2\n3\n' | .build/release/parseley sum

      - name: Upload CLI
        uses: actions/upload-artifact@v4
        with:
          name: parseley-cli-macos
          path: Packages/ParseleyKit/.build/release/parseley
          if-no-files-found: error

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build app (unsigned)
        run: |
          xcodegen
          status=0
          xcodebuild \
            -project Parseley.xcodeproj \
            -scheme Parseley \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1 || status=$?
          # Show only what matters: errors, warnings in our code, and the verdict.
          grep -E "error:|warning: .*/App/|BUILD (SUCCEEDED|FAILED)" xcodebuild.log || tail -n 40 xcodebuild.log
          exit $status
