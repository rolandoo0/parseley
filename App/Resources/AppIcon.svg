<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Parseley app icon, "clip sprout": a glass clipboard of numbers with parsley
       growing from the clip. Source artwork; the PNGs in Assets.xcassets are rendered
       from this file (see scripts/render-icons.js). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2448"/>
      <stop offset="0.55" stop-color="#0E1428"/>
      <stop offset="1" stop-color="#132C2A"/>
    </linearGradient>
    <radialGradient id="bloomCyan" cx="0.22" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#5EE7FF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#5EE7FF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#5EE7FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomGreen" cx="0.5" cy="0.2" r="0.45">
      <stop offset="0" stop-color="#5BD487" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5BD487" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloomLow" cx="0.85" cy="0.92" r="0.6">
      <stop offset="0" stop-color="#3BBF6A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3BBF6A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5BD487" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9BF0B6"/>
      <stop offset="1" stop-color="#3BBF6A"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FDD95"/>
      <stop offset="1" stop-color="#22954F"/>
    </linearGradient>
    <linearGradient id="total" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EE7FF"/>
      <stop offset="1" stop-color="#5BD487"/>
    </linearGradient>
    <!-- One flat-leaf parsley leaflet, base at the origin, pointing up. -->
    <path id="leaf" d="M0 0 C-3 -3 -5 -7 -6 -11 C-11 -11 -14 -15 -12 -19 C-11 -22 -8 -23 -6 -22 C-6 -27 -3 -30 0 -30 C3 -30 6 -27 6 -22 C8 -23 11 -22 12 -19 C14 -15 11 -11 6 -11 C5 -7 3 -3 0 0 Z"/>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- Body: Apple's macOS icon grid (824 px squircle centred on 1024) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bloomCyan)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bloomGreen)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bloomLow)"/>

    <!-- The mark, drawn on a 100-unit grid and scaled up. -->
    <g transform="translate(512 528) scale(7.4) translate(-50 -47)">
      <!-- soft green glow behind the sprout -->
      <ellipse cx="50" cy="12" rx="16" ry="12" fill="#5BD487" opacity="0.35" filter="url(#glow)"/>
      <!-- glass clipboard -->
      <rect x="24" y="34" width="52" height="58" rx="9" fill="url(#card)" stroke="url(#cardEdge)" stroke-width="0.9"/>
      <!-- sprout: a stem that forks into three trefoil parsley leaflets -->
      <path d="M50 30 V19 M50 24 C46 22 42 20 39 17 M50 24 C54 22 58 20 61 17" stroke="#2FA35C" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <use xlink:href="#leaf" href="#leaf" transform="translate(39 17.5) rotate(-50) scale(0.62)" fill="url(#leafB)"/>
      <use xlink:href="#leaf" href="#leaf" transform="translate(61 17.5) rotate(50) scale(0.62)" fill="url(#leafB)"/>
      <use xlink:href="#leaf" href="#leaf" transform="translate(50 19.5) scale(0.7)" fill="url(#leafA)"/>
      <!-- the clip -->
      <rect x="38" y="28" width="24" height="12" rx="5" fill="#16203F" stroke="#5BD487" stroke-width="2.2"/>
      <!-- number rows -->
      <rect x="33" y="52" width="26" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.78"/>
      <rect x="33" y="62.5" width="18" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.78"/>
      <!-- the total line and the total -->
      <line x1="33" y1="74.5" x2="67" y2="74.5" stroke="url(#total)" stroke-width="2" stroke-linecap="round"/>
      <rect x="44" y="80" width="23" height="6.5" rx="3.25" fill="url(#total)"/>
    </g>
  </g>
  <!-- light-catching edge -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
