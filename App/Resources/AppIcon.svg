<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16213E"/>
      <stop offset="0.55" stop-color="#0E1428"/>
      <stop offset="1" stop-color="#241A4A"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.25" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#5EE7FF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#5EE7FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#5EE7FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom2" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#9E8CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9E8CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5EE7FF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EE7FF"/>
      <stop offset="1" stop-color="#9E8CFF"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <!-- Body: Apple's macOS icon grid (824 px squircle centred on 1024) -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bloom)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bloom2)"/>
    <!-- faint data grid -->
    <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
      <line x1="100" y1="330" x2="924" y2="330"/><line x1="100" y1="512" x2="924" y2="512"/>
      <line x1="100" y1="694" x2="924" y2="694"/><line x1="330" y1="100" x2="330" y2="924"/>
      <line x1="694" y1="100" x2="694" y2="924"/>
    </g>
    <!-- glass clipboard card -->
    <rect x="258" y="232" width="508" height="590" rx="64" fill="url(#card)" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>
    <!-- clip at the top -->
    <rect x="410" y="196" width="204" height="72" rx="30" fill="#1B2547" stroke="url(#accent)" stroke-width="6"/>
    <!-- number rows -->
    <g fill="#FFFFFF" fill-opacity="0.18">
      <rect x="318" y="336" width="250" height="22" rx="11"/>
      <rect x="318" y="384" width="190" height="22" rx="11"/>
      <rect x="318" y="432" width="226" height="22" rx="11"/>
    </g>
    <rect x="318" y="486" width="388" height="5" rx="2.5" fill="url(#accent)" opacity="0.8"/>
    <!-- the sum -->
    <text x="512" y="742" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
          font-size="300" font-weight="300" fill="url(#accent)" filter="url(#glow)">Σ</text>
  </g>
  <!-- light-catching edge -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
