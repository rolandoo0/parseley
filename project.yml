# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen   # once
#   xcodegen                # whenever this file changes or files are added/removed
# Parseley.xcodeproj is generated and git-ignored: edit this file, not the project.
name: Parseley

options:
  bundleIdPrefix: io.github.rolandoo0
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"               # matches the package's Swift 5 language mode
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  ParseleyKit:
    path: Packages/ParseleyKit
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0

targets:
  Parseley:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Resources/Info.plist"
          - "Resources/AppIcon.svg"   # source artwork; the asset catalog holds the PNGs
          - "Resources/MenuBarIcon.svg"
    dependencies:
      - package: ParseleyKit
        products:
          - ParseleyCore
          - ParseleyStorage
          - ParseleyCapture
          - ParseleyPaste
      - package: KeyboardShortcuts
    configFiles:
      Debug: Config/Signing.xcconfig      # ad-hoc by default; see that file for your Team ID
      Release: Config/Signing.xcconfig
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Parseley
        # Versions come from the build settings (the release workflow sets them from the tag).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        # Menu-bar-only app: no Dock icon, no app menu bar.
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rolandoo0.parseley
        # No App Sandbox: auto-paste (M2) posts a synthetic ⌘V, which needs the
        # Accessibility permission and doesn't work well for sandboxed apps.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Signing lives in Config/Signing.xcconfig (ad-hoc unless you add
        # Config/Local.xcconfig with your Team ID). Don't set it here: settings in this
        # file override the xcconfig.

schemes:
  Parseley:
    build:
      targets:
        Parseley: all
    run:
      config: Debug
